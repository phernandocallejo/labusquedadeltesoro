<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>La Búsqueda del Tesoro - Sala 16</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            touch-action: none;
            overflow: hidden;
            position: relative;
        }
        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 30;
        }
        .card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .card p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #555;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 1.1rem;
            margin-top: 15px;
            border: 2px solid #ccc;
            border-radius: 5px;
            text-align: center;
            box-sizing: border-box;
        }
        button.action-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        button.action-btn:hover {
            background-color: #c0392b;
        }
        #error-msg {
            color: #e74c3c;
            font-size: 0.95rem;
            margin-top: 12px;
            font-weight: bold;
            display: none;
        }

        /* Lienzo interactivo para la goma de borrar fina */
        #scratchCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: grab;
        }

        /* Capa oculta con los números distribuidos */
        #secret-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #1a252f;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Panel de combinación numéricas elevado */
        #combination-panel {
            position: absolute;
            bottom: 110px;
            z-index: 10;
            background: rgba(44, 62, 80, 0.95);
            border: 2px solid #f1c40f;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            gap: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .digit-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .digit-group button {
            background: #e74c3c;
            color: white;
            border: none;
            width: 35px;
            height: 30px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .digit-group button:active {
            transform: scale(0.9);
        }
        .digit-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f1c40f;
            width: 35px;
        }

        #instructions-top {
            position: absolute;
            top: 15px;
            z-index: 10;
            color: #f1c40f;
            font-weight: bold;
            font-size: 0.95rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            width: 90%;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Contraseña Inicial -->
    <div id="password-screen" class="overlay-screen">
        <div class="card">
            <h2>Sala 16 🔒</h2>
            <p>Bienvenido, carahuevo.<br>Introduce la contraseña para continuar:</p>
            <input type="text" id="pass-input" placeholder="Escribe la clave..." autocomplete="off">
            <br>
            <button id="btn-entrar" class="action-btn" type="button">Entrar</button>
            <div id="error-msg">Contraseña incorrecta, prueba otra vez.</div>
        </div>
    </div>

    <div id="instructions-top">🔍 Algo está oculto en la oscuridad...</div>

    <!-- Capa oculta con los números -->
    <div id="secret-layer"></div>

    <!-- Lienzo de la goma de borrar -->
    <canvas id="scratchCanvas"></canvas>

    <!-- Panel de combinación de 4 dígitos -->
    <div id="combination-panel" style="display: none;">
        <div class="digit-group">
            <button onclick="cambiarDigito(0, 1)">+</button>
            <span class="digit-display" id="d0">0</span>
            <button onclick="cambiarDigito(0, -1)">-</button>
        </div>
        <div class="digit-group">
            <button onclick="cambiarDigito(1, 1)">+</button>
            <span class="digit-display" id="d1">0</span>
            <button onclick="cambiarDigito(1, -1)">-</button>
        </div>
        <div class="digit-group">
            <button onclick="cambiarDigito(2, 1)">+</button>
            <span class="digit-display" id="d2">0</span>
            <button onclick="cambiarDigito(2, -1)">-</button>
        </div>
        <div class="digit-group">
            <button onclick="cambiarDigito(3, 1)">+</button>
            <span class="digit-display" id="d3">0</span>
            <button onclick="cambiarDigito(3, -1)">-</button>
        </div>
    </div>

    <!-- Pantalla de Victoria Final -->
    <div id="win-message" class="overlay-screen" style="display: none; background: rgba(44, 62, 80, 0.98);">
        <div class="card">
            <h2 style="color: #27ae60;">¡Combinación correcta! 🎉</h2>
            <p>¡Has descifrado el código oculto!</p>
            <p><strong>Pasa a la sala 37.</strong><br>Contraseña: <strong>milan</strong></p>
            <button type="button" class="action-btn" onclick="location.reload()">Volver a jugar</button>
        </div>
    </div>

    <script>
        const CONTRASEÑA_CORRECTA = "bigmama"; 
        let CODIGO_SECRETO = [];
        let combinacionActual = [0, 0, 0, 0];

        const passInput = document.getElementById('pass-input');
        const btnEntrar = document.getElementById('btn-entrar');
        const errorMsg = document.getElementById('error-msg');
        const passwordScreen = document.getElementById('password-screen');

        function comprobarClave() {
            let valorEscrito = passInput.value.trim();
            if (valorEscrito.toLowerCase() === CONTRASEÑA_CORRECTA.toLowerCase()) {
                passwordScreen.style.display = 'none';
                document.getElementById('combination-panel').style.display = 'flex';
                generarCodigoAleatorio();
                iniciarJuegoGoma();
            } else {
                errorMsg.style.display = 'block';
                passInput.value = '';
                passInput.focus();
            }
        }

        btnEntrar.addEventListener('click', comprobarClave);
        passInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                comprobarClave();
            }
        });

        function generarCodigoAleatorio() {
            CODIGO_SECRETO = [];
            for (let i = 0; i < 4; i++) {
                CODIGO_SECRETO.push(Math.floor(Math.random() * 10));
            }
        }

        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const secretLayer = document.getElementById('secret-layer');

        function iniciarJuegoGoma() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            secretLayer.innerHTML = '';
            let anchoUtil = canvas.width * 0.8;
            let separacion = anchoUtil / 5;
            let centroX = canvas.width / 2;

            for (let i = 3; i >= 0; i--) {
                let digitoSpan = document.createElement('span');
                digitoSpan.innerText = CODIGO_SECRETO[i];
                digitoSpan.style.position = 'absolute';
                
                let x = centroX + (i - 1.5) * separacion + (Math.random() * 40 - 20);
                let y = canvas.height * 0.3 + (Math.random() * 200 - 100);

                digitoSpan.style.left = `${x}px`;
                digitoSpan.style.top = `${y}px`;
                digitoSpan.style.fontSize = '3.5rem';
                digitoSpan.style.fontWeight = 'bold';
                digitoSpan.style.color = '#e74c3c';
                digitoSpan.style.textShadow = '0 0 10px rgba(231, 76, 60, 0.5)';
                
                secretLayer.appendChild(digitoSpan);
            }
        }

        let borrando = false;

        function borrarEn(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2); // Radio de borrado más pequeño y preciso
            ctx.fill();
        }

        canvas.addEventListener('touchstart', (e) => {
            borrando = true;
            let t = e.touches[0];
            borrarEn(t.clientX, t.clientY);
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (!borrando) return;
            let t = e.touches[0];
            borrarEn(t.clientX, t.clientY);
        }, { passive: true });

        canvas.addEventListener('touchend', () => { borrando = false; });

        canvas.addEventListener('mousedown', (e) => {
            borrando = true;
            borrarEn(e.clientX, e.clientY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (borrando) {
                borrarEn(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mouseup', () => { borrando = false; });

        function cambiarDigito(indice, delta) {
            combinacionActual[indice] = (combinacionActual[indice] + delta + 10) % 10;
            document.getElementById(`d${indice}`).innerText = combinacionActual[indice];

            if (combinacionActual.every((val, idx) => val === CODIGO_SECRETO[idx])) {
                setTimeout(() => {
                    document.getElementById('win-message').style.display = 'flex';
                }, 300);
            }
        }
    </script>
</body>
</html>

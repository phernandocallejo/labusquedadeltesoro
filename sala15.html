<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>La Búsqueda del Tesoro - Sala 15</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
            touch-action: none;
            position: relative;
        }
        h1 {
            font-size: 1.2rem;
            margin: 5px 0 2px 0;
            z-index: 2;
        }
        p.instructions {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin: 0 0 10px 0;
            max-width: 340px;
            z-index: 2;
        }
        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .card p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #555;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 1.1rem;
            margin-top: 15px;
            border: 2px solid #ccc;
            border-radius: 5px;
            text-align: center;
            box-sizing: border-box;
        }
        button.action-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        button.action-btn:hover {
            background-color: #c0392b;
        }
        #error-msg {
            color: #e74c3c;
            font-size: 0.95rem;
            margin-top: 12px;
            font-weight: bold;
            display: none;
        }

        /* Dígitos ocultos en zigzag vertical adaptados a la parte superior */
        .hidden-digit {
            position: absolute;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #2c3e50; 
            user-select: none;
            z-index: 1;
            transition: color 0.15s, text-shadow 0.15s;
        }
        #digit-0 { top: 55px;  left: 45px; }   /* El 7 */
        #digit-1 { top: 105px; right: 55px; }  /* El 4 */
        #digit-2 { top: 155px; left: 65px; }   /* El 2 */
        #digit-3 { top: 205px; right: 65px; }  /* El 5 */

        /* Lupa estilizada */
        #magnifying-glass {
            position: absolute;
            top: 230px;
            left: 20px;
            width: 65px;
            height: 65px;
            background: rgba(241, 196, 15, 0.12);
            border: 4px solid #f1c40f;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            user-select: none;
            z-index: 5;
        }
        #magnifying-glass::after {
            content: "";
            position: absolute;
            bottom: -22px;
            right: -15px;
            width: 7px;
            height: 28px;
            background-color: #f1c40f;
            transform: rotate(-45deg);
            border-radius: 3px;
        }

        /* Contenedor del juego subido un tercio de la pantalla */
        #game-container {
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 2;
            margin-top: 305px; /* Sube todo el bloque superior/teclado */
        }
        #code-display {
            font-size: 1.2rem;
            letter-spacing: 5px;
            background: #1abc9c;
            color: #fff;
            padding: 4px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-weight: bold;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            width: 100%;
        }
        .key-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .key-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Contraseña Inicial -->
    <div id="password-screen" class="overlay-screen">
        <div class="card">
            <h2>Sala 15 🔒</h2>
            <p>Bienvenido, carahuevo.<br>Introduce la contraseña para continuar:</p>
            <input type="text" id="pass-input" placeholder="Escribe la clave..." autocomplete="off">
            <br>
            <button id="btn-entrar" class="action-btn" type="button">Entrar</button>
            <div id="error-msg">Contraseña incorrecta, prueba otra vez.</div>
        </div>
    </div>

    <h1>¡Desafío número 15! 🔍</h1>
    <p class="instructions">Hemos perdido el codigo secreto!</p>

    <!-- Dígitos ocultos en zigzag vertical -->
    <div id="digit-0" class="hidden-digit">7</div>
    <div id="digit-1" class="hidden-digit">4</div>
    <div id="digit-2" class="hidden-digit">2</div>
    <div id="digit-3" class="hidden-digit">5</div>

    <!-- Lupa flotante -->
    <div id="magnifying-glass"></div>

    <!-- Contenedor del teclado numérico elevado -->
    <div id="game-container">
        <div id="code-display">____</div>

        <div class="keypad">
            <button class="key-btn" onclick="agregarNumero('1')">1</button>
            <button class="key-btn" onclick="agregarNumero('2')">2</button>
            <button class="key-btn" onclick="agregarNumero('3')">3</button>
            <button class="key-btn" onclick="agregarNumero('4')">4</button>
            <button class="key-btn" onclick="agregarNumero('5')">5</button>
            <button class="key-btn" onclick="agregarNumero('6')">6</button>
            <button class="key-btn" onclick="agregarNumero('7')">7</button>
            <button class="key-btn" onclick="agregarNumero('8')">8</button>
            <button class="key-btn" onclick="agregarNumero('9')">9</button>
            <button class="key-btn" style="background-color: #e74c3c;" onclick="borrarCodigo()">⌫</button>
            <button class="key-btn" onclick="agregarNumero('0')">0</button>
            <button class="key-btn" style="background-color: #27ae60;" onclick="probarCodigo()">✓</button>
        </div>
    </div>

    <!-- Pantalla de Victoria Final -->
    <div id="win-message" class="overlay-screen" style="display: none;">
        <div class="card">
            <h2 style="color: #27ae60;">¡Código correcto! 🎉</h2>
            <p>¡Has descubierto el secreto con la lupa!</p>
            <p><strong>Pasa a la sala 42.</strong><br>Contraseña: <strong>rintintin</strong></p>
            <button type="button" class="action-btn" onclick="reiniciarJuego()">Volver a jugar</button>
        </div>
    </div>

    <script>
        const CONTRASEÑA_CORRECTA = "globo y chincheta"; 
        const CODIGO_SECRETO = "7425";

        const passInput = document.getElementById('pass-input');
        const btnEntrar = document.getElementById('btn-entrar');
        const errorMsg = document.getElementById('error-msg');
        const passwordScreen = document.getElementById('password-screen');

        function comprobarClave() {
            let valorEscrito = passInput.value.trim();
            if (valorEscrito.toLowerCase() === CONTRASEÑA_CORRECTA.toLowerCase()) {
                passwordScreen.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                passInput.value = '';
                passInput.focus();
            }
        }

        btnEntrar.addEventListener('click', comprobarClave);
        passInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                comprobarClave();
            }
        });

        // Lógica de la Lupa y detección de los dígitos ocultos
        const glass = document.getElementById('magnifying-glass');
        const digits = document.querySelectorAll('.hidden-digit');
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        function iniciarArrastre(e) {
            isDragging = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let rect = glass.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
            e.preventDefault();
        }

        function moverLupa(e) {
            if (!isDragging) return;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let x = clientX - offsetX;
            let y = clientY - offsetY;

            let maxX = window.innerWidth - glass.offsetWidth;
            let maxY = window.innerHeight - glass.offsetHeight - 210; // Límite para no invadir el teclado

            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            glass.style.left = x + 'px';
            glass.style.top = y + 'px';

            verificarColisionLupa();
        }

        function finalizarArrastre() {
            isDragging = false;
        }

        glass.addEventListener('mousedown', iniciarArrastre);
        document.addEventListener('mousemove', moverLupa);
        document.addEventListener('mouseup', finalizarArrastre);

        glass.addEventListener('touchstart', iniciarArrastre);
        document.addEventListener('touchmove', moverLupa);
        document.addEventListener('touchend', finalizarArrastre);

        function verificarColisionLupa() {
            let glassRect = glass.getBoundingClientRect();

            digits.forEach(digit => {
                let digitRect = digit.getBoundingClientRect();
                let overlap = !(glassRect.right < digitRect.left || 
                                glassRect.left > digitRect.right || 
                                glassRect.bottom < digitRect.top || 
                                glassRect.top > digitRect.bottom);

                if (overlap) {
                    digit.style.color = "#f1c40f"; 
                    digit.style.textShadow = "0 0 10px #f1c40f";
                } else {
                    digit.style.color = "#2c3e50"; 
                    digit.style.textShadow = "none";
                }
            });
        }

        // Lógica del teclado numérico
        let codigoIngresado = "";
        const codeDisplay = document.getElementById('code-display');

        function agregarNumero(num) {
            if (codigoIngresado.length < 4) {
                codigoIngresado += num;
                actualizarPantallaCodigo();
            }
        }

        function borrarCodigo() {
            codigoIngresado = codigoIngresado.slice(0, -1);
            actualizarPantallaCodigo();
        }

        function actualizarPantallaCodigo() {
            codeDisplay.innerText = codigoIngresado.padEnd(4, '_');
        }

        function probarCodigo() {
            if (codigoIngresado === CODIGO_SECRETO) {
                setTimeout(() => {
                    document.getElementById('win-message').style.display = 'flex';
                }, 300);
            } else {
                alert("¡Código incorrecto! Sigue buscando con la lupa.");
                codigoIngresado = "";
                actualizarPantallaCodigo();
            }
        }

        function reiniciarJuego() {
            document.getElementById('win-message').style.display = 'none';
            codigoIngresado = "";
            actualizarPantallaCodigo();
            glass.style.left = '20px';
            glass.style.top = '230px';
            digits.forEach(digit => {
                digit.style.color = "#2c3e50";
                digit.style.textShadow = "none";
            });
        }
    </script>
</body>
</html>
